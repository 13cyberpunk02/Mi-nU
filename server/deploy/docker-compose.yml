# Mi`nU's server on a Linux machine: PostgreSQL, MinU.Server, and Caddy in front for HTTPS.
# See server/deploy/README.md. Settings come from .env next to this file (copy .env.example).
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: minu
      POSTGRES_USER: minu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minu -d minu"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ..
    image: minu-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Kerberos is never used here, and trying it only logs a missing library.
      ConnectionStrings__Default: Host=postgres;Database=minu;Username=minu;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      # Only Caddy reaches the server, so the client address it forwards can be trusted.
      ReverseProxy__Enabled: "true"
      Turn__Secret: ${TURN_SECRET:?set TURN_SECRET in .env}
      Turn__Urls__0: stun:${TURN_HOST:?set TURN_HOST in .env}:3478
      Turn__Urls__1: turn:${TURN_HOST}:3478?transport=udp
      Turn__Urls__2: turn:${TURN_HOST}:3478?transport=tcp
      Turn__Urls__3: turns:${TURN_HOST}:5349?transport=tcp
      # Push notifications: the Firebase service account key, see README step 3.
      Firebase__CredentialsFile: /run/secrets/firebase.json
      # Files: the server talks to SeaweedFS inside this network, and signs download links for FILES_DOMAIN.
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__PublicUrl: https://${FILES_DOMAIN:?set FILES_DOMAIN in .env}
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
    volumes:
      - ./firebase.json:/run/secrets/firebase.json:ro

  # S3-compatible file storage. Only its S3 port is reachable from outside, through Caddy on FILES_DOMAIN,
  # and every request there needs the server's signature; the admin interfaces stay inside this network.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    # Volumes of 256 MB, as many as the free disk space holds. SeaweedFS's default is 30 GB volumes,
    # which a small server can't create at all: every upload then fails.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=256 -volume.max=0
    configs:
      - source: s3
        target: /etc/seaweedfs/s3.json
    volumes:
      - seaweedfs:/data

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    depends_on:
      - server
      - seaweedfs
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      FILES_DOMAIN: ${FILES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# The one identity allowed into storage: the server's, with the keys from .env.
configs:
  s3:
    content: |
      {"identities":[{"name":"minu","credentials":[{"accessKey":"${STORAGE_ACCESS_KEY}","secretKey":"${STORAGE_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}

volumes:
  postgres:
  seaweedfs:
  caddy_data:
  caddy_config:
